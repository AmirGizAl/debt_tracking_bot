# Throwaway PostgreSQL for the test suite (data lives in tmpfs and disappears on stop):
#   docker compose -f docker-compose.test.yml up -d
#   export TEST_DATABASE_URL=postgresql+asyncpg://debtbot:debtbot@localhost:55432/debtbot_test
name: debtbot_test

services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: debtbot
      POSTGRES_PASSWORD: debtbot
      POSTGRES_DB: debtbot_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data

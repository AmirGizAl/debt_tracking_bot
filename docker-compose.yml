x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: debtbot
      POSTGRES_PASSWORD: debtbot
      POSTGRES_DB: debtbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debtbot -d debtbot"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      hysteria:
        condition: service_started
    logging: *default-logging

  # Hysteria2 client: a SOCKS5 proxy to Telegram for running inside Russia.
  # The bot reaches it as socks5://hysteria:1080 (PROXY_URL in .env); not published outside.
  hysteria:
    image: tobyxdd/hysteria:latest
    restart: unless-stopped
    command: ["client", "-c", "/etc/hysteria/config.yaml"]
    volumes:
      - ./hysteria/config.yaml:/etc/hysteria/config.yaml:ro
    logging: *default-logging

volumes:
  pgdata:
  redisdata:

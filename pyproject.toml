[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "debt-tracking-bot"
version = "1.0.0"
description = "Telegram-бот учёта долгов и кассы"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram[proxy,redis]==3.31.0",
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "openpyxl==3.1.5",
    "pydantic-settings==2.15.0",
    "reportlab==5.0.1",
    "sqlalchemy[asyncio]==2.1.1",
    "tzdata==2026.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/fonts/*.ttf"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "DTZ", "RUF", "PT"]
ignore = [
    # Russian texts legitimately contain Cyrillic letters and the U+2212 minus sign.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Hysteria2 client config (used only with `docker compose --profile proxy`).
# Copy to config.yaml (gitignored) and fill in values from your share link:
#   hysteria2://AUTH@SERVER:PORT?insecure=1#name
#   -> server: SERVER:PORT, auth: AUTH, tls.insecure: true (only if insecure=1 is present)

server: your-server-host:443

auth: your-auth-string

tls:
  insecure: false

# Listen on all interfaces inside the container so the bot reaches it as hysteria:1080.
socks5:
  listen: 0.0.0.0:1080
